<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar note game</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/audio.css">
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&display=swap" rel="stylesheet">
    <script src="script/logic.js"></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">Placeholder</h1>
    </header>
    <main class="main">
        <div class="content">
            <div class="audios">
                <audio controls>
                    <source class="E-note player" src="./audio/E-note.mp3" type="audio/mp3">
                </audio>
                <audio controls>                    
                    <source class="A-note player" src="./audio/A-note.mp3" type="audio/mp3">
                </audio>
                <audio controls>                
                    <source class="D-note player" src="./audio/D-note.mp3" type="audio/mp3">
                </audio>
                <audio controls>
                    <source class="G-note player" src="./audio/G-note.mp3" type="audio/mp3">
                </audio>
                <audio controls>                    
                    <source class="B-note player" src="./audio/B-note.mp3" type="audio/mp3">
                </audio> 
            </div>
        </div>
    </main>
</body>
</html>

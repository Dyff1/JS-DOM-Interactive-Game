<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar note game</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/audio.css">
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&display=swap" rel="stylesheet">
    <script src="script/logic.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">Guitar note game</h1>
    </header>
    <main class="main">
        <div class="main__header">
            <p class="bread__text input">Welcome</p>
            <p class="bread__text input">Are you ready to start the game?</p>
            <div class="input__area">
                <input class="center" id="input-start-game" type="text" placeholder="">
                <p class="bread__text hidden" id="input-target-text"></p>
            </div>
        </div>
        <div class="content">
            <div class="audios">
                <audio controls class="E-note player hidden">
                    <source src="./audio/E-note.mp3" type="audio/mp3">
                </audio>
                <audio controls class="A-note player hidden">                    
                    <source src="./audio/A-note.mp3" type="audio/mp3">
                </audio>
                <audio controls class="D-note player hidden">                
                    <source src="./audio/D-note.mp3" type="audio/mp3">
                </audio>
                <audio controls class="G-note player hidden">
                    <source src="./audio/G-note.mp3" type="audio/mp3">
                </audio>
                <audio controls class="B-note player hidden">                    
                    <source src="./audio/B-note.mp3" type="audio/mp3">
                </audio> 
            </div>
        </div>
    </main>
</body>
</html>
